<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 | 부산 갈맷길 100M</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 24px 40px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(30, 41, 59, 0.5);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 0.875rem;
        }
        .scanner-container {
            max-width: 500px;
            margin: 0 auto 40px;
            overflow: hidden;
            border-radius: 12px;
            border: 2px solid #334155;
        }
        .tab-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .tab-btn {
            padding: 10px 20px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }
    </style>
</head>
<body>
    <nav class="nav-desktop">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span>ADMIN</span>
            </a>
            <div style="color:#94a3b8; font-size:0.9rem;">관리자 모드</div>
        </div>
    </nav>

    <div class="admin-container">
        <!-- Login Overlay -->
        <div id="login-overlay" style="position:fixed; inset:0; background:#0a0a0f; z-index:1000; display:flex; align-items:center; justify-content:center;">
            <div class="glass-card" style="padding:40px; width:100%; max-width:400px; text-align:center;">
                <h2 style="margin-bottom:24px;">관리자 로그인</h2>
                <input type="text" id="admin-id" placeholder="아이디" class="form-input" style="margin-bottom:16px;">
                <input type="password" id="admin-pw" placeholder="비밀번호" class="form-input" style="margin-bottom:16px;">
                <button onclick="checkAdmin()" class="btn-primary" style="width:100%;">접속</button>
            </div>
        </div>

        <div id="admin-content" style="display:none;">
            <h1 style="margin-bottom:32px;">대회 현황 대시보드</h1>

            <!-- Stats -->
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total">-</div>
                    <div class="stat-label">총 신청자</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-100m">-</div>
                    <div class="stat-label">100M 신청</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-50m">-</div>
                    <div class="stat-label">50M 신청</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-checked">-</div>
                    <div class="stat-label">현장 체크인 완료</div>
                </div>
            </div>

            <div class="tab-buttons">
                <button class="tab-btn active" onclick="showTab('scan')">QR 스캔</button>
                <button class="tab-btn" onclick="showTab('list')">참가자 명단</button>
            </div>

            <!-- QR Scanner Tab -->
            <div id="tab-scan">
                <div class="glass-card" style="padding:24px; text-align:center;">
                    <h3 style="margin-bottom:16px;">📷 QR 체크인</h3>
                    <div class="scanner-container">
                        <div id="reader"></div>
                    </div>
                    <p id="scan-result" style="margin-top:16px; font-size:1.1rem; color:#ef4444; font-weight:bold; min-height:1.5em;"></p>
                </div>
            </div>

            <!-- List Tab -->
            <div id="tab-list" style="display:none;">
                <div class="glass-card" style="padding:24px;">
                    <h3 style="margin-bottom:16px;">참가자 목록</h3>
                    <input type="text" id="search-participant" placeholder="이름 또는 전화번호 검색" class="form-input" style="margin-bottom:16px;" onkeyup="filterList()">
                    <div style="overflow-x:auto;">
                        <table style="width:100%; border-collapse:collapse; color:#cbd5e1;">
                            <thead>
                                <tr style="border-bottom:1px solid #334155;">
                                    <th style="padding:12px; text-align:left;">이름</th>
                                    <th style="padding:12px; text-align:left;">코스</th>
                                    <th style="padding:12px; text-align:left;">전화번호</th>
                                    <th style="padding:12px; text-align:left;">상태</th>
                                    <th style="padding:12px; text-align:right;">액션</th>
                                </tr>
                            </thead>
                            <tbody id="participant-list">
                                <!-- Filled by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Admin Credentials Storage (In-memory)
        let adminCreds = {
            username: '',
            password: ''
        };

        async function checkAdmin() {
            const id = document.getElementById('admin-id').value;
            const pw = document.getElementById('admin-pw').value;

            if (!id || !pw) {
                alert('아이디와 비밀번호를 입력해주세요.');
                return;
            }

            try {
                const res = await fetchData('login', { username: id, password: pw }, 'POST');
                if (res.success) {
                    adminCreds.username = id;
                    adminCreds.password = pw;
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('admin-content').style.display = 'block';
                    loadAdminData();
                    startScanner();
                } else {
                    alert('로그인 실패: ' + (res.error || '아이디 또는 비밀번호가 잘못되었습니다.'));
                }
            } catch (e) {
                console.error(e);
                alert('서버 통신 오류');
            }
        }

        let participants = [];

        async function loadAdminData() {
            try {
                const res = await fetchData('getAdminData', {
                    username: adminCreds.username,
                    password: adminCreds.password
                });

                if (res && res.registrations) {
                    participants = res.registrations;
                    updateStats();
                    renderList();
                } else if (res.error) {
                    alert('데이터 로드 실패: ' + res.error);
                }
            } catch (e) {
                console.error(e);
                alert('데이터를 불러오는 중 오류가 발생했습니다.');
            }
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = participants.length;
            document.getElementById('stat-100m').textContent = participants.filter(p => p.course === '100M').length;
            document.getElementById('stat-50m').textContent = participants.filter(p => p.course === '50M').length;
            document.getElementById('stat-checked').textContent = participants.filter(p => p.status === '체크인완료').length;
        }

        function renderList() {
            const tbody = document.getElementById('participant-list');
            const search = document.getElementById('search-participant').value.toLowerCase();

            tbody.innerHTML = participants
                .filter(p => p.name.toLowerCase().includes(search) || p.phone.includes(search))
                .map((p, i) => `
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                        <td style="padding:12px;">${p.name}</td>
                        <td style="padding:12px;">${p.course}</td>
                        <td style="padding:12px;">${p.phone}</td>
                        <td style="padding:12px;">
                            <span style="color:${p.status === '체크인완료' ? '#22c55e' : '#94a3b8'}">${p.status}</span>
                        </td>
                        <td style="padding:12px; text-align:right;">
                            ${p.status !== '체크인완료' ?
                                `<button onclick="checkIn('${p.name}', '${p.phone}')" class="btn-secondary" style="padding:4px 12px; font-size:0.8rem;">체크인</button>` :
                                ''}
                        </td>
                    </tr>
                `).join('');
        }

        function filterList() {
            renderList();
        }

        function showTab(tab) {
            document.getElementById('tab-scan').style.display = tab === 'scan' ? 'block' : 'none';
            document.getElementById('tab-list').style.display = tab === 'list' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function checkIn(name, phone) {
            if (!confirm(`${name}님을 체크인 처리하시겠습니까?`)) return;

            try {
                // Call backend (POST)
                const res = await fetchData('updateStatus', {
                    username: adminCreds.username,
                    password: adminCreds.password,
                    name: name,
                    phone: phone,
                    status: '체크인완료'
                }, 'POST');

                if (res.success) {
                    // Optimistic update
                    const p = participants.find(p => p.name === name && p.phone === phone);
                    if (p) {
                        p.status = '체크인완료';
                        updateStats();
                        renderList();
                        alert(`${name}님 체크인 완료`);
                    }
                } else {
                    alert('오류: ' + (res.error || '업데이트 실패'));
                }
            } catch (e) {
                alert('통신 오류 발생');
                console.error(e);
            }
        }

        // Scanner
        function startScanner() {
            const html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Assume QR code contains JSON: {"name":"홍길동", "phone":"010-1234-5678"}
            try {
                const data = JSON.parse(decodedText);
                document.getElementById('scan-result').textContent = `스캔됨: ${data.name}`;
                checkIn(data.name, data.phone);
            } catch (e) {
                document.getElementById('scan-result').textContent = `QR 형식 오류: ${decodedText}`;
            }
        }
    </script>
</body>
</html>
